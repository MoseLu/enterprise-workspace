name: PR Validation

on:
  pull_request:
    branches: [main, develop]
  pull_request_target:

jobs:
  pr-title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;
            
            // Conventional Commits pattern
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|chore|hotfix|release)(\(.+\))?: .+/;
            
            if (!pattern.test(title)) {
              console.log('PR title:', title);
              console.log('Pattern check: FAILED');
              console.log('Expected format: <type>(<scope>): <subject>');
              console.log('Types: feat, fix, docs, style, refactor, perf, test, chore, hotfix, release');
            } else {
              console.log('PR title:', title);
              console.log('Pattern check: PASSED');
            }

  pr-size-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check PR size
        run: |
          echo "=== PR Size Check ==="
          echo "Changes detected in this PR"
          echo ""
          echo "Files changed will be reviewed during merge"

  branch-name-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          echo "=== Branch Name Validation ==="
          BRANCH_NAME=${{ github.ref_name }}
          echo "Current branch: $BRANCH_NAME"
          
          # Branch name patterns
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "✓ Main branch"
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "✓ Develop branch"
          elif [[ "$BRANCH_NAME" =~ ^feature/.+ ]]; then
            echo "✓ Feature branch"
          elif [[ "$BRANCH_NAME" =~ ^bugfix/.+ ]]; then
            echo "✓ Bugfix branch"
          elif [[ "$BRANCH_NAME" =~ ^hotfix/.+ ]]; then
            echo "✓ Hotfix branch"
          elif [[ "$BRANCH_NAME" =~ ^release/.+ ]]; then
            echo "✓ Release branch"
          else
            echo "⚠ Branch name may not follow standard convention"
            echo "Recommended patterns:"
            echo "  - feature/<name>"
            echo "  - bugfix/<description>"
            echo "  - hotfix/<version>"
            echo "  - release/<version>"
          fi

  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for conflicts
        run: |
          echo "=== Conflict Check ==="
          echo "Please ensure no merge conflicts before merging"

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation check
        run: |
          echo "=== Documentation Check ==="
          if [ -f "WORKSPACE.md" ]; then
            echo "✓ Workspace documentation present"
          fi
          if [ -f ".github/BRANCH_STRATEGY.md" ]; then
            echo "✓ Branch strategy documented"
          fi

  summary:
    needs: [pr-title-check, branch-name-check, conflict-check, docs-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: PR Validation Summary
        run: |
          echo "=== PR Validation Complete ==="
          echo "Please review any warnings above"
          echo ""
          echo "Branch Strategy: .github/BRANCH_STRATEGY.md"
