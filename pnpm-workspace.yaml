#
# Enterprise Workspace - pnpm workspace configuration
# pnpm 工作区配置
#
# 此文件定义了 monorepo 中所有子包的路径
# 所有子包都会自动链接，可以相互引用
#

packages:
  # ===========================================
  # 第1.5层：全局共享层 (common)
  # ===========================================
  # 【唯一全局共享层】聚合前后端所有通用能力，内部强隔离
  # 前端共享：common/frontend（UI组件、hooks、工具、i18n、设计令牌等）
  # 后端共享：common/backend/（跨语言契约 + Go/Python/Java专属层）
  - 'common/frontend'
  - 'common/frontend/**'
  - 'common/backend'
  - 'common/backend/**'

  # ===========================================
  # 第2层：AI/RAG 知识库层
  # ===========================================
  # RAG 知识库系统：为 Sisyphus AI 助手提供自动检索能力
  - 'knowledge-base/RAG'

  # ===========================================
  # 第3层：基础设施层 (infra)
  # ===========================================
  # devstation基建层：支撑开发站的系统级项目（前后端一体）
  - 'infra'
  - 'infra/**'

  # ===========================================
  # 第4层：业务项目层 (products)
  # ===========================================
  # 所有基于devstation的业务项目：前后端一体/纯前端/纯后端
  # 依赖规则：前端依赖 common/frontend，后端依赖 common/backend/对应语言
  - 'products/devstation'
  - 'products/devstation/**'
  - 'products/pc-admin'
  - 'products/pc-admin/**'
  - 'products/metagpt-service'

# ===========================================
# 共享依赖配置
# ===========================================
#
# 通过 public-hoist-pattern 将某些包提升到根目录
# 这样可以减少重复安装，提高安装速度
#
public-hoist-pattern:
  # 开发工具
  - '*eslint*'
  - '*prettier*'
  - '*typescript*'
  - '*husky*'
  - '*lint-staged*'
  - '*commitlint*'

  # 基础类型
  - '@types/*'

  # 构建工具
  - '*vite*'
  - '*webpack*'
  - '*rollup*'

# ===========================================
# 依赖安装策略
# ===========================================
#
# prefer-workspace-protocol: true
#   - 当引用 workspace 内的包时，使用 workspace: 前缀
#   - 例如: @enterprise-workspace/design-system
#
# symlink: false
#   - 不创建符号链接，直接复制包内容
#
prefer-workspace-protocol: true

# ===========================================
# 缓存配置
# ===========================================
#
# node-linker: hoisted
#   - 使用提升的 node_modules 结构（类似 npm）
#   - 避免某些包需要 peer dependencies 的问题
#
node-linker: hoisted

# ===========================================
# 插件配置
# ===========================================
#
# 仅启用必要的插件，避免启动过慢
#
onlyBuiltDependencies:
  - '@ant-design/icons'
  - '@ant-design/pro-icons'
