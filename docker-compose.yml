# ============================================
# Docker Compose 本地开发中间件配置
# ============================================
# 支持一键启动所有本地开发所需的中间件服务
# 使用方法: docker-compose -f docker-compose.yml up -d
# 停止服务: docker-compose -f docker-compose.yml down

services:
  ## ============================================ MySQL 数据库 ============================================
  mysql:
    container_name: enterprise-mysql
    image: mysql:8.0
    version: "8.0"
    restart: unless-stopped
    environment:
      # MySQL root密码（开发环境使用，生产环境请使用secrets）
      MYSQL_ROOT_PASSWORD: root
      # 创建业务数据库
      MYSQL_DATABASE: enterprise
      # 字符集配置
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      # MySQL默认端口映射（宿主机端口:容器端口）
      - "3306:3306"
    volumes:
      # 数据持久化目录
      - mysql-data:/var/lib/mysql
      # 初始化脚本目录（首次启动执行）
      - ./infra/docker/middleware/mysql/init:/docker-entrypoint-initdb.d
      # 配置文件目录
      - ./infra/docker/middleware/mysql/conf:/etc/mysql/conf.d
    command: |
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max_connections=1000
      --innodb_buffer_pool_size=512M
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## ============================================ Redis 缓存服务 ============================================
  redis:
    container_name: enterprise-redis
    image: redis:7.2-alpine
    version: "7.2"
    restart: unless-stopped
    ports:
      # Redis默认端口映射
      - "6379:6379"
    volumes:
      # 数据持久化目录
      - redis-data:/data
      # 配置文件目录
      - ./infra/docker/middleware/redis/conf:/usr/local/etc/redis
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## ============================================ Nacos 配置中心 ============================================
  nacos:
    container_name: enterprise-nacos
    image: nacos/nacos-server:v2.3.2
    version: "v2.3.2"
    restart: unless-stopped
    environment:
      # Nacos运行模式（单机模式）
      MODE: standalone
      # Spring配置文件格式
      SPRING_DATASOURCE_PLATFORM: mysql
      # 数据库连接配置
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: enterprise
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root
      # Nacos控制台认证（开发环境使用）
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: enterprise
    ports:
      # Nacos控制台端口
      - "8848:8848"
    volumes:
      # 数据持久化目录
      - nacos-data:/home/nacos/data
      # 日志目录
      - nacos-logs:/home/nacos/logs
      # 配置文件目录
      - ./infra/docker/middleware/nacos/conf:/home/nacos/conf
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## ============================================ MinIO 对象存储（可选） ============================================
  minio:
    container_name: enterprise-minio
    image: minio/minio:RELEASE.2024-01-01T00-00-00Z
    version: "latest"
    restart: unless-stopped
    environment:
      # MinIO控制台账号
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
      # MinIO服务地址（用于客户端连接）
      MINIO_SERVER_URL: http://localhost:9000
    ports:
      # MinIO API端口
      - "9000:9000"
      # MinIO控制台端口
      - "9001:9001"
    volumes:
      # 数据持久化目录
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## ============================================ Elasticsearch 搜索引擎（可选） ============================================
  elasticsearch:
    container_name: enterprise-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    version: "8.11.0"
    restart: unless-stopped
    environment:
      # 集群名称
      cluster.name: enterprise-cluster
      # 节点名称
      node.name: enterprise-node-1
      # 内存配置
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      # 单机模式配置
      discovery.type: single-node
      # 安全配置（开发环境禁用）
      xpack.security.enabled: "false"
    ports:
      # Elasticsearch HTTP端口
      - "9200:9200"
    volumes:
      # 数据持久化目录
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - enterprise-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5

## ============================================ 网络配置 ============================================
networks:
  enterprise-network:
    driver: bridge

## ============================================ 数据卷配置 ============================================
volumes:
  # MySQL数据卷
  mysql-data:
    driver: local
  # Redis数据卷
  redis-data:
    driver: local
  # Nacos数据卷
  nacos-data:
    driver: local
  nacos-logs:
    driver: local
  # MinIO数据卷
  minio-data:
    driver: local
  # Elasticsearch数据卷
  elasticsearch-data:
    driver: local

## ============================================ 使用说明 ============================================
# 1. 启动所有服务: docker-compose up -d
# 2. 查看服务状态: docker-compose ps
# 3. 查看服务日志: docker-compose logs -f [服务名]
# 4. 停止所有服务: docker-compose down
# 5. 停止并删除数据卷: docker-compose down -v
